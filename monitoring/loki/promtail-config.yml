server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time

      # Sensitive Data Masking Stages
      # 1. Mask JWT Bearer tokens
      - replace:
          expression: '(Bearer\s+)[A-Za-z0-9\-_=]+\.[A-Za-z0-9\-_=]+\.?[A-Za-z0-9\-_=]*'
          replace: '$1[MASKED_TOKEN]'

      # 2. Mask passwords
      - replace:
          expression: '(?i)(password["\']?\s*[:=]\s*["\']?)([^"\'\s&]+)'
          replace: '$1[MASKED_SECRET]'

      # 3. Mask Google Gemini API Keys
      - replace:
          expression: 'AIza[0-9A-Za-z-_]{35}'
          replace: '[MASKED_GEMINI_KEY]'

      # 4. Mask 6-digit Relative PIN codes
      - replace:
          expression: '(?i)(pin["\']?\s*[:=]\s*["\']?)(\d{6})'
          replace: '$1[MASKED_PIN]'

      - output:
          source: output
