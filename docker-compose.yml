# Bir xil fayl lokalda ham, DigitalOcean Droplet'da ham ishlaydi.
# Lokal: docker compose up -d   (Caddy'siz ishlatish uchun: --scale caddy=0)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Bir xil image, boshqa command — ORM modellari nusxalanmaydi.
  notifier:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "notifier.main"]
    environment:
      RUN_MIGRATIONS: "false"
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web-doctor:
    build:
      context: ./web-doctor
      dockerfile: Dockerfile
    restart: unless-stopped

  web-relative:
    build:
      context: ./web-relative
      dockerfile: Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - api
      - web-doctor
      - web-relative
