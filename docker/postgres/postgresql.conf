# PostgreSQL 16 Production Tuning for NAZORAT Enterprise
# Optimized for 2GB - 4GB RAM Host / Container Limits

# Connection Settings
max_connections = 100
superuser_reserved_connections = 3

# Memory Settings
shared_buffers = 256MB                  # 25% of container RAM
work_mem = 16MB                         # Memory per sorting/hash operation
maintenance_work_mem = 64MB             # Memory for VACUUM, CREATE INDEX
effective_cache_size = 768MB            # Kernel disk cache estimate
temp_buffers = 8MB

# Write-Ahead Logging (WAL) & Checkpoints
wal_level = replica
wal_buffers = 16MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB
archive_mode = off

# Planner / Storage Tuning (NVMe / SSD)
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200

# Query Tuning & Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 50MB
log_min_duration_statement = 1000       # Log slow queries taking > 1.0s
log_line_prefix = '%m [%p] %u@%d '
log_lock_waits = on
log_checkpoints = on

# Client Connection
statement_timeout = 30000               # 30s timeout per statement
idle_in_transaction_session_timeout = 60000  # 60s
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# Locale & Timezone (Mandatory Asia/Tashkent Domain Rule)
timezone = 'Asia/Tashkent'
log_timezone = 'Asia/Tashkent'
client_encoding = 'UTF8'
