# PostgreSQL 16 Production Tuning for WMAX
# Defaults sized for a small (1 GB RAM) container. Raise the memory settings
# below on a larger host.

# Connection Settings
#
# Overriding config_file drops the image's generated defaults, so both of these
# must be set explicitly: without listen_addresses PostgreSQL falls back to
# 'localhost' and every other container gets "connection refused", and hba_file
# would otherwise be looked up next to this file instead of in PGDATA.
listen_addresses = '*'
hba_file = '/var/lib/postgresql/data/pgdata/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pgdata/pg_ident.conf'
max_connections = 50
superuser_reserved_connections = 3

# Memory Settings
shared_buffers = 64MB                  # 25% of container RAM
work_mem = 4MB                         # Memory per sorting/hash operation
maintenance_work_mem = 32MB             # Memory for VACUUM, CREATE INDEX
effective_cache_size = 192MB            # Kernel disk cache estimate
temp_buffers = 8MB

# Write-Ahead Logging (WAL) & Checkpoints
wal_level = replica
wal_buffers = 16MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 512MB
min_wal_size = 128MB
archive_mode = off

# Planner / Storage Tuning (NVMe / SSD)
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200

# Query Tuning & Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 50MB
log_min_duration_statement = 1000       # Log slow queries taking > 1.0s
log_line_prefix = '%m [%p] %u@%d '
log_lock_waits = on
log_checkpoints = on

# Client Connection
statement_timeout = 30000               # 30s timeout per statement
idle_in_transaction_session_timeout = 60000  # 60s
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# Locale & Timezone (Mandatory Asia/Tashkent Domain Rule)
timezone = 'Asia/Tashkent'
log_timezone = 'Asia/Tashkent'
client_encoding = 'UTF8'
