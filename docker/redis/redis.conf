# Redis 7 Production Configuration for NAZORAT Enterprise
# Network
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
loglevel notice
logfile ""
databases 16

# Persistence (AOF - Append Only File for zero data loss)
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management & Eviction
maxmemory 256mb
maxmemory-policy volatile-lru
maxmemory-samples 5

# Lazy Freeing (improves latency under load)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Security & Command Hardening
# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command SHUTDOWN "SHUTDOWN_NAZORAT_ADMIN"

# Slow Log & Latency Monitoring
slowlog-log-slower-than 10000           # 10ms
slowlog-max-len 128
latency-monitor-threshold 100           # 100ms
