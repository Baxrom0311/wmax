# NAZORAT Enterprise Production Docker Compose Stack
# Architecture: FastAPI + PostgreSQL + Redis + Gemini AI + Prometheus + Grafana + Loki + Nginx

services:
  # -------------------------------------------------------------
  # 1. Database (PostgreSQL 16 with Production Tuning)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nazorat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nazorat}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../contracts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../../contracts/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nazorat} -d ${POSTGRES_DB:-nazorat}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend_net
      - monitoring_net

  # -------------------------------------------------------------
  # 2. In-Memory Cache & Message Broker (Redis 7 with AOF)
  # -------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: always
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redisdata:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend_net
      - monitoring_net

  # -------------------------------------------------------------
  # 3. Core Backend (FastAPI Python 3.12)
  # -------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: always
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-nazorat}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-nazorat}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TZ_LOCAL: ${TZ_LOCAL:-Asia/Tashkent}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - frontend_net
      - backend_net
      - monitoring_net

  # -------------------------------------------------------------
  # 4. Background Worker (Notifier & Escalation Daemon)
  # -------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "notifier.main"]
    restart: always
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-nazorat}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-nazorat}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend_net
      - monitoring_net

  # -------------------------------------------------------------
  # 5. Doctor Clinical Dashboard (Web-Doctor)
  # -------------------------------------------------------------
  web-doctor:
    build:
      context: ../../web-doctor
      dockerfile: Dockerfile
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend_net

  # -------------------------------------------------------------
  # 6. Patient Relative Portal (Web-Relative at /r/)
  # -------------------------------------------------------------
  web-relative:
    build:
      context: ../../web-relative
      dockerfile: Dockerfile
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend_net

  # -------------------------------------------------------------
  # 7. Enterprise Reverse Proxy & SSL Gateway (Nginx)
  # -------------------------------------------------------------
  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      web-doctor:
        condition: service_started
      web-relative:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"
    networks:
      - frontend_net
      - monitoring_net

  # -------------------------------------------------------------
  # 8. Let's Encrypt SSL Automation Daemon (Certbot)
  # -------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - frontend_net

  # -------------------------------------------------------------
  # 9. Metrics Collection (Prometheus)
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: always
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - monitoring_net

  # -------------------------------------------------------------
  # 10. Dashboards & Visualization (Grafana)
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-nazorat_admin_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-nazorat.example.uz}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - frontend_net
      - monitoring_net

  # -------------------------------------------------------------
  # 11. Centralized Log Ingestion (Loki)
  # -------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.1
    restart: always
    volumes:
      - ../../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    networks:
      - monitoring_net

  # -------------------------------------------------------------
  # 12. Container Log Shipper & Sensitive Data Masking (Promtail)
  # -------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.1.1
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring_net

volumes:
  pgdata:
  redisdata:
  certbot_etc:
  certbot_var:
  certbot_www:
  nginx_logs:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
  monitoring_net:
    driver: bridge
