openapi: 3.1.0
info:
  title: WMAX API
  description: Remote Patient Monitoring — production-grade clinical signal backend
  version: 2.0.0
servers:
- url: /
  description: Standart origin (Lokal dev :8000 yoki reverse proxy ildizi)
paths:
  /api/v1/auth/request-code:
    post:
      tags:
      - auth
      summary: Request SMS login code
      operationId: request_code_api_v1_auth_request_code_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCodeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/verify-code:
    post:
      tags:
      - auth
      summary: Verify SMS code and issue tokens
      operationId: verify_code_api_v1_auth_verify_code_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Clinician login with phone & password
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/relative/login:
    post:
      tags:
      - auth
      summary: Caregiver / Relative login with PIN code
      operationId: relative_login_api_v1_auth_relative_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelativeLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelativeLoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/patient/login:
    post:
      tags:
      - auth
      summary: Patient login with phone & PIN
      operationId: patient_login_api_v1_auth_patient_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh access token with refresh token rotation
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout and revoke refresh token
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Get currently authenticated user
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
      security:
      - HTTPBearer: []
  /api/v1/access/accept:
    post:
      tags:
      - access
      summary: Accept a caregiver access invitation
      operationId: accept_access_api_v1_access_accept_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessAcceptRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Accept Access Api V1 Access Accept Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ingest/readings:
    post:
      tags:
      - ingest
      summary: Batch upload of 5-minute aggregates using a per-device token.
      description: 'Accepts 5-minute physiological aggregates from wearable devices.

        Idempotent: duplicate (patient_id, ts) pairs are silently ignored.

        Triggers clinical signal evaluation pipeline on every accepted batch.'
      operationId: ingest_batch_api_v1_ingest_readings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestBatch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ingest/health-data:
    post:
      tags:
      - ingest
      summary: Batch upload of Wear OS Health Services and Health Connect records.
      operationId: ingest_health_data_api_v1_ingest_health_data_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthDataBatch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDataIngestResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ingest/sos:
    post:
      tags:
      - ingest
      summary: Raise SOS using a per-device token.
      operationId: ingest_sos_api_v1_ingest_sos_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSosRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Ingest Sos Api V1 Ingest Sos Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/orphans:
    get:
      tags:
      - orphans
      summary: List unresolved orphan readings
      operationId: list_orphans_api_v1_orphans_get
      security:
      - HTTPBearer: []
      parameters:
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Device Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                title: Response List Orphans Api V1 Orphans Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orphans/{id}/candidates:
    get:
      tags:
      - orphans
      summary: List candidate patients for an orphan reading
      operationId: orphan_candidates_endpoint_api_v1_orphans__id__candidates_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                title: Response Orphan Candidates Endpoint Api V1 Orphans  Id  Candidates
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orphans/{id}/resolve:
    post:
      tags:
      - orphans
      summary: Attach orphan reading to a patient
      operationId: resolve_orphan_api_v1_orphans__id__resolve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveOrphanRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Resolve Orphan Api V1 Orphans  Id  Resolve Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orphans/{id}/discard:
    post:
      tags:
      - orphans
      summary: Discard orphan reading without deleting it
      operationId: discard_orphan_api_v1_orphans__id__discard_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Discard Orphan Api V1 Orphans  Id  Discard Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts:
    get:
      tags:
      - alerts
      summary: List clinical alerts with optional filters
      operationId: list_alerts_api_v1_alerts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: patient_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Patient Id
      - name: level
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - green
            - amber
            - red
            - no_data
            type: string
          - type: 'null'
          title: Level
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                title: Response List Alerts Api V1 Alerts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients:
    get:
      tags:
      - patients
      summary: 'Worklist sorted by acuity: red > no_data > amber > green.'
      operationId: list_patients_api_v1_patients_get
      security:
      - HTTPBearer: []
      parameters:
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by district
          title: District
        description: Filter by district
      - name: level
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - green
            - amber
            - red
            - no_data
            type: string
          - type: 'null'
          description: Filter by alert level
          title: Level
        description: Filter by alert level
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientSummary'
                title: Response List Patients Api V1 Patients Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - patients
      summary: Create a new patient
      operationId: create_patient_api_v1_patients_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Create Patient Api V1 Patients Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}:
    get:
      tags:
      - patients
      summary: Patient detail with multi-param series, baselines, trend, and prognosis.
      operationId: get_patient_detail_api_v1_patients__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 1
          description: History window in days
          default: 7
          title: Days
        description: History window in days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - patients
      summary: Patch patient profile
      operationId: patch_patient_api_v1_patients__id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Patch Patient Api V1 Patients  Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/timeline:
    get:
      tags:
      - patients
      summary: Patient event timeline
      operationId: patient_timeline_api_v1_patients__id__timeline_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                title: Response Patient Timeline Api V1 Patients  Id  Timeline Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/readings:
    get:
      tags:
      - patients
      summary: Patient readings
      operationId: patient_readings_api_v1_patients__id__readings_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                title: Response Patient Readings Api V1 Patients  Id  Readings Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/baseline:
    get:
      tags:
      - patients
      summary: Current patient baseline
      operationId: patient_baseline_api_v1_patients__id__baseline_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                title: Response Patient Baseline Api V1 Patients  Id  Baseline Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/baseline/approve:
    post:
      tags:
      - patients
      summary: Doctor approves personal baseline
      operationId: approve_baseline_contract_api_v1_patients__id__baseline_approve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Approve Baseline Contract Api V1 Patients  Id  Baseline
                  Approve Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/deceased:
    post:
      tags:
      - patients
      summary: Mark patient deceased
      operationId: mark_deceased_api_v1_patients__id__deceased_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Mark Deceased Api V1 Patients  Id  Deceased Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/discharge:
    post:
      tags:
      - patients
      summary: Discharge patient and create 24h active-call follow-up task.
      operationId: discharge_patient_api_v1_patients__id__discharge_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/approve-baseline:
    post:
      tags:
      - patients
      summary: Doctor approves personal baseline — transitions patient from learning
        to full phase.
      operationId: approve_baseline_api_v1_patients__id__approve_baseline_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Approve Baseline Api V1 Patients  Id  Approve Baseline
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/memberships:
    post:
      tags:
      - patients
      summary: Admit patient to a clinic
      operationId: create_membership_api_v1_patients__id__memberships_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Create Membership Api V1 Patients  Id  Memberships
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/memberships/{mid}:
    delete:
      tags:
      - patients
      summary: Revoke patient clinic membership
      operationId: revoke_membership_api_v1_patients__id__memberships__mid__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      - name: mid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Mid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Revoke Membership Api V1 Patients  Id  Memberships  Mid  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/memberships/{mid}/baseline-decision:
    post:
      tags:
      - patients
      summary: Record baseline ownership decision
      operationId: membership_baseline_decision_api_v1_patients__id__memberships__mid__baseline_decision_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      - name: mid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Mid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineDecisionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Membership Baseline Decision Api V1 Patients  Id  Memberships  Mid  Baseline
                  Decision Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{id}/access/invite:
    post:
      tags:
      - patients
      summary: Invite caregiver access
      operationId: invite_access_api_v1_patients__id__access_invite_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessInviteRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
