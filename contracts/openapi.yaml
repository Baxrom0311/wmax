tags:
- name: auth
  description: Foydalanuvchilar autentifikatsiyasi va JWT tokenlar boshqaruvi (shifokor,
    hamshira, dispetcher, yaqin qarindosh, bemor).
- name: ingest
  description: Aqlli soat (Wear OS) va sensorlardan 5 daqiqalik o'lchovlar oqimini
    qabul qilish va signal tekshiruvi (idempotent, X-Ingest-Key himoyalangan).
- name: patients
  description: Bemorlar profili, dispanser nazorati, vital parametrlar, baseline (me'yorlar),
    audit va kasallik tarixi.
- name: ai-clinical
  description: 'Sun''iy intellekt (AI) klinik assistenti: prognoz, dekompensatsiya
    xavfi va shifokor tavsiyalari (fallbacks bilan).'
- name: sos
  description: Favqulodda SOS signallari, dispetcherlik boshqaruvi va SSE (Server-Sent
    Events) real-vaqt monitoringi.
- name: tasks
  description: Patronaj hamshiralar uchun klinik vazifalar va patronaj buyruqlarini
    boshqarish.
- name: devices
  description: Wearable qurilmalar parki, bemorga biriktirish va qaytarib olish amallari.
- name: relative
  description: Yaqin qarindoshlar portali — cheklangan holat ko'rinishi va xabardorlik.
- name: billing
  description: Monitoring obuna rejalari, to'lovlar va invoyslar hisobi.
- name: profile
  description: Foydalanuvchi shaxsiy hisobi va sozlamalari.
- name: ops
  description: Infratuzilma salomatligi, liveness/readiness tekshiruvlari va monitoring
    darchalari.
- name: observability
  description: Prometheus metrikalari va monitoring tahlili.
