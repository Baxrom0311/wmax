# NAZORAT Local Development Stack with Nginx (HTTP-only)
# Usage: docker compose -f ops/docker-compose.nginx-local.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nazorat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nazorat123}
      POSTGRES_DB: ${POSTGRES_DB:-nazorat}
    volumes:
      - pgdata_local:/var/lib/postgresql/data
      - ../contracts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../contracts/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nazorat} -d ${POSTGRES_DB:-nazorat}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  notifier:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "notifier.main"]
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web-doctor:
    build:
      context: ../web-doctor
      dockerfile: Dockerfile
    restart: unless-stopped

  web-relative:
    build:
      context: ../web-relative
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/nazorat-local.conf.example:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web-doctor
      - web-relative

volumes:
  pgdata_local:
