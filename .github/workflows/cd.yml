name: NAZORAT CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  deploy-to-production:
    name: Deploy to Production Droplet
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via Rsync and Trigger Production Script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_DIR: /opt/nazorat
        run: |
          echo "Adding host key to known_hosts..."
          mkdir -p ~/.ssh
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

          echo "Synchronizing project files to ${SSH_USER}@${SSH_HOST}:${TARGET_DIR}..."
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.venv' \
            --exclude 'pgdata' \
            --exclude 'caddy_data' \
            --exclude 'caddy_config' \
            --exclude 'nginx_logs' \
            --exclude 'certbot_data' \
            --exclude 'dist' \
            --exclude 'build' \
            --exclude '.gradle' \
            ./ "${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/"

          echo "Executing production deployment script on remote server..."
          ssh "${SSH_USER}@${SSH_HOST}" "cd ${TARGET_DIR} && ./ops/scripts/deploy-prod.sh"
