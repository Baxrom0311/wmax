name: WMAX Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Linting & Code Quality
  # -------------------------------------------------------------
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.10

      - name: Ruff Fast Lint
        run: ruff check backend/ notifier/ contracts/timewin.py

      - name: Validate deployment shell scripts
        run: bash -n scripts/*.sh

  # -------------------------------------------------------------
  # Job 2: Automated Tests
  # -------------------------------------------------------------
  automated-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/algo/requirements.txt
          pip install -r notifier/requirements.txt
          pip install pytest pytest-asyncio aiosqlite httpx redis

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: .:./backend:./contracts
          ENV: testing
          JWT_SECRET: test_secret_32_bytes_long_string_12345
        run: |
          pytest -q backend/app/tests backend/algo/tests notifier/tests

  client-validation:
    name: Web and Flutter Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web-doctor/package-lock.json
            web-relative/package-lock.json
      - name: Build and lint web-doctor
        working-directory: web-doctor
        run: npm ci && npm run lint && npm run build
      - name: Build and lint web-relative
        working-directory: web-relative
        run: npm ci && npm run lint && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate Flutter and Android flavors
        working-directory: mobile_flutter
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          flutter build apk --debug --flavor phone
          flutter build apk --debug --flavor wear

  ios-validation:
    name: iOS Compile Validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies and compile iOS
        working-directory: mobile_flutter
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign

  migrations-check:
    name: PostgreSQL Migration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wmax
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wmax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wmax -d wmax"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install migration dependencies
        run: pip install -r backend/requirements.txt
      - name: Upgrade, check model drift, and exercise downgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://wmax:ci@localhost:5432/wmax
          PYTHONPATH: .:./backend:./contracts
          ENV: testing
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  # -------------------------------------------------------------
  # Job 3: Production container build
  # -------------------------------------------------------------
  docker-build:
    name: Build & Validate Containers
    runs-on: ubuntu-latest
    needs: [automated-tests, client-validation, ios-validation]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: wmax/api:latest

      - name: Build Nginx Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/nginx
          file: ./docker/nginx/Dockerfile
          push: false
          tags: wmax/nginx:latest

      - name: Build Web-Doctor Image
        uses: docker/build-push-action@v5
        with:
          context: ./web-doctor
          file: ./web-doctor/Dockerfile
          push: false
          tags: wmax/web-doctor:latest

      - name: Build Web-Relative Image
        uses: docker/build-push-action@v5
        with:
          context: ./web-relative
          file: ./web-relative/Dockerfile
          push: false
          tags: wmax/web-relative:latest

  # -------------------------------------------------------------
  # Job 4: Release deployment with candidate health verification
  # -------------------------------------------------------------
  deploy:
    name: Release Deploy to Ubuntu 24.04
    runs-on: ubuntu-latest
    needs: [docker-build, migrations-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rsync Code to Target Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          TARGET_DIR: /opt/wmax
        run: |
          mkdir -p ~/.ssh
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "SSH_KNOWN_HOSTS must contain the host key verified out-of-band." >&2
            exit 1
          fi
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # --delete keeps the server a mirror of the repo, so every path that
          # lives ONLY on the server must be excluded. Missing `.env` here would
          # wipe the production secrets on the first deploy.
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'pgdata' \
            --exclude 'redisdata' \
            --exclude 'caddy_data' \
            --exclude 'nginx_logs' \
            --exclude 'certbot_data' \
            --exclude 'backups' \
            --exclude '.deploy_state' \
            --exclude 'dist' \
            --exclude 'build' \
            --exclude 'wear' \
            ./ "${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/"

      - name: Deploy candidate release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_DIR: /opt/wmax
          DEPLOY_RELEASE: ${{ github.sha }}
        run: |
          ssh "${SSH_USER}@${SSH_HOST}" "DEPLOY_RELEASE='${DEPLOY_RELEASE}' bash -s" << 'EOF'
            set -euo pipefail
            cd /opt/wmax
            
            # Deploy records a release only after readiness succeeds. On failure,
            # rollback recreates the last recorded immutable image tags.
            if ! ./scripts/deploy.sh; then
              echo "[-] Deployment failed! Triggering emergency rollback..."
              ./scripts/rollback.sh
              exit 1
            fi
            
            # Run final comprehensive health checks
            if ! ./scripts/healthcheck.sh; then
              echo "[-] Health checks failed; restoring previous release..."
              ./scripts/rollback.sh
              exit 1
            fi
          EOF

      - name: Verify the live site answers through the domain
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_RELEASE: ${{ github.sha }}
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          # A healthy container is not the same as a reachable site: nginx,
          # DNS or TLS can still be broken. Check what a user actually hits.
          healthy=false
          health_url="${PRODUCTION_HEALTH_URL:-https://wmax.boos.uz/api/v1/health}"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$health_url" || true)
            if [ "$code" = "200" ]; then
              echo "✓ $health_url -> 200"
              if curl -fsS "$health_url"; then
                healthy=true
                break
              fi
            fi
            echo "  urinish $i: HTTP $code — 10s kutish"
            sleep 10
          done
          if [ "$healthy" = true ]; then
            ssh "${SSH_USER}@${SSH_HOST}" "DEPLOY_RELEASE='${DEPLOY_RELEASE}' /opt/wmax/scripts/mark_release_success.sh"
          else
            echo "✗ Sayt deploy'dan keyin javob bermadi; oldingi release qaytarilmoqda" >&2
            ssh "${SSH_USER}@${SSH_HOST}" /opt/wmax/scripts/rollback.sh
            exit 1
          fi
