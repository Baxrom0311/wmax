name: WMAX CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-test:
    name: Backend Validation & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/algo/requirements.txt
          pip install -r backend/auth/requirements.txt
          pip install -r notifier/requirements.txt
          pip install ruff pytest

      - name: Ruff Code Quality & Lint
        run: |
          ruff check backend/ notifier/ contracts/timewin.py

      - name: Run Backend Tests
        env:
          PYTHONPATH: .:./backend:./contracts
          ENV: testing
        run: |
          pytest -q

  migrations-check:
    name: Schema Migrations (ORM is the single source of truth)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wmax
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wmax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wmax -d wmax"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/auth/requirements.txt

      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgresql+asyncpg://wmax:ci@localhost:5432/wmax
          PYTHONPATH: .:./backend:./contracts
          ENV: testing
        working-directory: backend
        run: alembic upgrade head

      - name: Fail if the ORM has drifted from the migrations
        env:
          DATABASE_URL: postgresql+asyncpg://wmax:ci@localhost:5432/wmax
          PYTHONPATH: .:./backend:./contracts
          ENV: testing
        working-directory: backend
        # A model changed without `alembic revision --autogenerate` would
        # otherwise reach production as a table that silently does not exist.
        run: alembic check

      - name: Verify migrations are reversible
        env:
          DATABASE_URL: postgresql+asyncpg://wmax:ci@localhost:5432/wmax
          PYTHONPATH: .:./backend:./contracts
          ENV: testing
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            web-doctor/package.json
            web-relative/package.json

      - name: Build Web-Doctor (Clinical Dashboard)
        working-directory: web-doctor
        run: |
          npm ci
          npm run lint || true
          npm run build

      - name: Build Web-Relative (Patient Relative Portal)
        working-directory: web-relative
        run: |
          npm ci
          npm run build

  docker-build-verification:
    name: Docker Build Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: wmax-backend:test

      - name: Build Web-Doctor Image
        uses: docker/build-push-action@v5
        with:
          context: ./web-doctor
          file: ./web-doctor/Dockerfile
          push: false
          tags: wmax-web-doctor:test

      - name: Build Web-Relative Image
        uses: docker/build-push-action@v5
        with:
          context: ./web-relative
          file: ./web-relative/Dockerfile
          push: false
          tags: wmax-web-relative:test

      - name: Build Nginx Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/nginx
          file: ./docker/nginx/Dockerfile
          push: false
          tags: wmax-nginx:test
